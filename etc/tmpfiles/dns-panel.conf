# Sockets and locks of the current boot. One root /run/dns-panel, with directories split by PRIVILEGE
# BOUNDARY, not by process.
#
# Creating a socket means writing to the directory. Daemons run as different users (dns-ha, root, pdns);
# a directory writable by all would let the panel agent write where the HA loop does, breaking the very
# boundary manager and agent are split for. Hence:
#   ha/    — HA loop: manager (dns-ha) and privileged agent (root). Group dns-ha = may use HA IPC; the panel
#            (www-data ∈ dns-ha) uses the sockets but gets nothing more.
#   pdns/  — the panel's dns-agent (pdns), intermediary to the PowerDNS control socket. Owned by pdns and
#            setgid www-data: the socket gets the panel's group while pdns stays out of it (members of
#            www-data read the panel's secrets), and www-data may open the socket but not write here.
d /run/dns-panel      0755 root root     -
d /run/dns-panel/ha   0770 root dns-ha   -
d /run/dns-panel/pdns 2750 pdns www-data -
#   pulse/ — pulse-server control socket. Used by the daemon (creates it) and the panel (signals "rule
#            changed"), hence group www-data with write; unrelated to HA IPC.
d /run/dns-panel/pulse 0770 root www-data -
#   sync/  — wake socket of dns-sync-worker (www-data). The panel (www-data) pokes it after queueing work, the HA
#            manager (dns-ha) when the node may write again; setgid dns-ha gives the socket that group.
d /run/dns-panel/sync 2750 www-data dns-ha -
