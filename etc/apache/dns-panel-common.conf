# The panel site, shared by the :80 vhost (dns-panel.conf) and the :443 one that deploy/tls.sh writes.
# DocumentRoot /var/www/vhost/dns-panel is a symlink to /opt/dns-panel/www. The familiar path is kept on
# purpose (logs, external runbooks, monitoring), but there is only one real tree.
DocumentRoot /var/www/vhost/dns-panel

<Directory /var/www/vhost/dns-panel>
    AllowOverride All
    # +FollowSymLinks is required: DocumentRoot itself is a symlink to /opt/dns-panel/www.
    Options +ExecCGI +FollowSymLinks -Indexes
    Require all granted
    DirectoryIndex index.pl
    AddHandler cgi-script .pl
</Directory>
# panel.fcgi: one persistent process instead of a CGI start per request (www/panel.fcgi).
<IfModule mod_fcgid.c>
    FcgidMaxProcessesPerClass 8
    FcgidMaxRequestsPerProcess 1000
    FcgidIOTimeout 600
    FcgidBusyTimeout 600
    FcgidMaxRequestLen 2000000
</IfModule>
