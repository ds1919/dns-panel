# Panel Apache vhost. Source of truth is /opt/dns-panel/etc/apache/dns-panel.conf;
# /etc/apache2/sites-available/dns-panel.conf is a symlink to it, so product config lives in the product tree.
# HTTPS is added by deploy/tls.sh when certificates are in /opt/dns-panel/etc/tls/.
<VirtualHost *:80>
    Include /opt/dns-panel/etc/apache/dns-panel-common.conf
    # With HTTPS set up, this redirects everything but the readiness probes to it (written by deploy/tls.sh).
    IncludeOptional /opt/dns-panel/etc/apache/dns-panel-tls-redirect.conf
</VirtualHost>
