# ─── Option 4: BGP via BIRD ────────────────────────────────────────────────────────────────────────────────
# BIRD holds the $ADDRESS/32 announcement (static protocol anycast_dns); the watcher only enables/disables it.
# On the DC1 router node1 is local and node2 remote: announce only while the local node is ready. [conditions]:
#   node1_up = "ANNOUNCE"   node2_up = "WITHDRAW"   both_down = "WITHDRAW"   both_up = "WITHDRAW"   stop = "WITHDRAW"
#
# [ANNOUNCE]
# commands = [ "birdc enable anycast_dns" ]
# [WITHDRAW]
# commands = [ "birdc disable anycast_dns" ]
